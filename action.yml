name: 'Connect auth-vpn'
description: >
  Connects this GitHub Actions runner to your self-hosted auth-vpn server.

inputs:
  server:
    description: 'VPN server address in host:port format (e.g. 203.0.113.10:7777)'
    required: true

  api-key:
    description: >
      Server API key (stored as a GitHub secret, e.g. VPN_API_KEY).
      The action uses this to create a unique ephemeral token for every job
      run and delete it automatically on disconnect — no conflicts between
      parallel matrix jobs, no leftover tokens.
    required: true

  api-url:
    description: >
      Full URL of the server API. Defaults to https://<host>:9100.
      Must be https:// (the API key is never sent over plain HTTP to a
      remote host).
    required: false

  fingerprint:
    description: >
      The server certificate fingerprint (SHA256:..., printed by
      `auth-vpn server install`; store it as a variable or secret).
      Pins both the API call and the tunnel, so nobody on the network
      path can impersonate your server. Strongly recommended; without it
      the action connects with certificate checks off and warns.
    required: false

  routes:
    description: >
      Extra CIDR blocks to route through the VPN, comma-separated.
      Example: "20.29.40.0/24,10.20.0.0/16"
      Not needed when your data sources run on the same VM as auth-vpn —
      use 10.8.0.1 as host in that case (the server TUN IP is always routed).
    required: false

  mode:
    description: >
      Connection mode.
        tun   — (default) full OS-level routing, requires sudo.
                Works on standard GitHub-hosted ubuntu runners.
        proxy — explicit TCP port-forwards only, no root needed.
    default: 'tun'

  forwards:
    description: >
      Proxy mode only. Space-separated port-forward rules:
      "localPort:remoteHost:remotePort", e.g. "5432:10.8.0.1:5432"
    required: false

  version:
    description: 'auth-vpn release version (e.g. v2.0.2). Defaults to latest.'
    default: 'latest'

runs:
  using: 'composite'
  steps:
    # ── Install ────────────────────────────────────────────────────────────────
    - name: Install auth-vpn
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
      run: |
        VERSION="$IN_VERSION"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sfL \
            https://api.github.com/repos/adishM98/auth-vpn/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\(.*\)".*/\1/')
        fi

        if [ -z "$VERSION" ]; then
          echo "::error::Could not resolve auth-vpn version (GitHub API rate limit?)"
          exit 1
        fi

        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  GOARCH="amd64" ;;
          aarch64) GOARCH="arm64" ;;
          *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        BIN_URL="https://github.com/adishM98/auth-vpn/releases/download/${VERSION}/auth-vpn-linux-${GOARCH}"
        echo "Downloading auth-vpn ${VERSION} (${GOARCH}) from ${BIN_URL}"

        TMP_BIN=$(mktemp)
        for attempt in 1 2 3; do
          if curl -fL --retry 2 --retry-delay 3 "$BIN_URL" -o "$TMP_BIN"; then
            break
          fi
          echo "Download attempt ${attempt} failed, retrying..."
          sleep 5
        done

        if [ ! -s "$TMP_BIN" ]; then
          echo "::error::Failed to download auth-vpn binary from ${BIN_URL}"
          exit 1
        fi

        sudo install -m 755 "$TMP_BIN" /usr/local/bin/auth-vpn
        rm -f "$TMP_BIN"
        auth-vpn version

    # ── TUN mode ──────────────────────────────────────────────────────────────
    - name: Connect (TUN mode)
      if: inputs.mode != 'proxy'
      shell: bash
      # Inputs travel as env vars, never spliced into the script text.
      env:
        AUTH_VPN_API_KEY: ${{ inputs.api-key }}
        IN_SERVER: ${{ inputs.server }}
        IN_API_URL: ${{ inputs.api-url }}
        IN_FINGERPRINT: ${{ inputs.fingerprint }}
        IN_ROUTES: ${{ inputs.routes }}
      run: |
        SERVER_HOST="${IN_SERVER%:*}"
        API_URL="${IN_API_URL:-https://${SERVER_HOST}:9100}"

        ARGS=(--background --reconnect --github-action --api-url "$API_URL")
        if [ -n "$IN_FINGERPRINT" ]; then
          ARGS+=(--fingerprint "$IN_FINGERPRINT")
        else
          echo "::warning::auth-vpn: no 'fingerprint' input; connecting without certificate checks. Set it to the fingerprint printed by 'auth-vpn server install'."
          ARGS+=(--insecure)
        fi

        # Add each comma-separated CIDR as a --route flag.
        IFS=',' read -ra CIDRS <<< "$IN_ROUTES"
        for cidr in "${CIDRS[@]}"; do
          cidr="${cidr// /}"
          [ -n "$cidr" ] && ARGS+=(--route "$cidr")
        done

        sudo -E auth-vpn connect "$IN_SERVER" "${ARGS[@]}" &

        # Poll until tunnel.json reports connected (up to 30 s).
        for i in $(seq 1 30); do
          sudo -E auth-vpn status 2>/dev/null | grep -q "status: connected" && break
          sleep 1
        done

        sudo -E auth-vpn status
        echo "::notice::auth-vpn tunnel is up (ephemeral token auto-generated for this job)"

    # ── Proxy mode ────────────────────────────────────────────────────────────
    - name: Connect (Proxy mode)
      if: inputs.mode == 'proxy'
      shell: bash
      env:
        AUTH_VPN_API_KEY: ${{ inputs.api-key }}
        IN_SERVER: ${{ inputs.server }}
        IN_API_URL: ${{ inputs.api-url }}
        IN_FINGERPRINT: ${{ inputs.fingerprint }}
        IN_FORWARDS: ${{ inputs.forwards }}
      run: |
        if [ -z "$IN_FORWARDS" ]; then
          echo "::error::inputs.forwards is required in proxy mode"
          exit 1
        fi

        SERVER_HOST="${IN_SERVER%:*}"
        API_URL="${IN_API_URL:-https://${SERVER_HOST}:9100}"

        ARGS=(--background --reconnect --github-action --api-url "$API_URL")
        if [ -n "$IN_FINGERPRINT" ]; then
          ARGS+=(--fingerprint "$IN_FINGERPRINT")
        else
          echo "::warning::auth-vpn: no 'fingerprint' input; connecting without certificate checks. Set it to the fingerprint printed by 'auth-vpn server install'."
          ARGS+=(--insecure)
        fi
        read -ra FWDS <<< "$IN_FORWARDS"
        for f in "${FWDS[@]}"; do
          ARGS+=(--forward "$f")
        done

        auth-vpn connect "$IN_SERVER" "${ARGS[@]}" &

        for i in $(seq 1 30); do
          auth-vpn status 2>/dev/null | grep -q "status: connected" && break
          sleep 1
        done

        auth-vpn status
        echo "::notice::auth-vpn proxy tunnel is up"
