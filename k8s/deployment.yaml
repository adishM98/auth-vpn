apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-vpn
  template:
    metadata:
      labels:
        app: auth-vpn
    spec:
      serviceAccountName: auth-vpn
      containers:
        - name: auth-vpn
          image: ghcr.io/adishm98/auth-vpn:latest
          imagePullPolicy: Always
          env:
            - name: AUTH_VPN_PORT
              value: "7777"  # change if 7777 is taken; update the ports below to match
            # Service CIDR pushed to clients. Auto-guessed from inside the pod
            # (/16 around the API server's ClusterIP); set it if the guess is wrong.
            # - name: AUTH_VPN_PUSH_ROUTES
            #   value: "10.0.0.0/16"
            # Only make Services labelled auth-vpn.io/expose=true reachable (enforced
            # by the server, no NetworkPolicy needed). Default "all" = whole cluster.
            # - name: AUTH_VPN_EXPOSE
            #   value: "labeled"
          ports:
            - name: vpn
              containerPort: 7777
            - name: dashboard
              containerPort: 9100
            - name: ssh
              containerPort: 2222
          securityContext:
            capabilities:
              add:
                - NET_ADMIN   # TUN device, ip commands, iptables
                - NET_RAW     # iptables raw table
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: config
              mountPath: /etc/auth-vpn
            - name: tun-device
              mountPath: /dev/net/tun
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: auth-vpn-data
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
